services:
  - type: web
    name: hnxt-logistics
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false
      # Enquiries only reach anyone by email. Free instances block ports
      # 25, 465 and 587, so use a provider that accepts 2525 (e.g. Brevo).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ENQUIRY_INBOX
        value: info@hnxtlogistics.com
